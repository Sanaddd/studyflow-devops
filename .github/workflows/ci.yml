# CI for StudyFlow (Assignment 2)
# - test:        lint, unit tests and a 70% coverage gate for each service
# - integration: the whole system in docker compose, testing the call across the seam
# - images:      builds each service image on every push and pull request,
#                and publishes it to GHCR, tagged with the commit SHA, only from main
name: CI

on:
  push:
  pull_request:
  workflow_call: # lets the CD workflow run this CI first and deploy only if it passes

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        service: [courses, assignments]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Tests run against a throwaway SQL Server container, never Azure SQL.
      # Its password is generated for this run only, so no secret is stored in the repo.
      - name: Start SQL Server
        run: |
          SA_PASSWORD="Ci_$(openssl rand -hex 12)_1a"
          echo "::add-mask::$SA_PASSWORD"
          docker run -d --name sqlserver -e ACCEPT_EULA=Y -e "MSSQL_SA_PASSWORD=$SA_PASSWORD" \
            -p 1433:1433 mcr.microsoft.com/mssql/server:2022-latest
          echo "TEST_SQLSERVER_URL=mssql://sa:$SA_PASSWORD@localhost:1433/master" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Wait for SQL Server
        run: |
          for attempt in $(seq 1 30); do
            python -c "import os, pymssql; from urllib.parse import urlparse; u = urlparse(os.environ['TEST_SQLSERVER_URL']); pymssql.connect(server=u.hostname, port=u.port, user=u.username, password=u.password).close()" && exit 0
            echo "SQL Server not ready ($attempt/30)"; sleep 2
          done
          exit 1
      - name: Lint
        run: ruff check .
      - name: Run tests with coverage (fails below 70%, see .coveragerc)
        run: python -m pytest -v --cov --cov-report=term

  integration:
    # The real system, both services and SQL Server, started by docker compose
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Passwords generated for this run only, never stored in the repo
      - name: Create .env
        run: |
          for name in SA_PASSWORD COURSES_DB_PASSWORD ASSIGNMENTS_DB_PASSWORD; do
            value="Ci_$(openssl rand -hex 12)_1a"
            echo "::add-mask::$value"
            echo "$name=$value" >> .env
          done
      - name: Start the system
        run: docker compose up --build -d
      - name: Install pytest
        run: pip install pytest==9.2.0
      - name: Run the cross-service test
        run: python -m pytest tests/integration -v
      - name: Show service logs if it failed
        if: failure()
        run: docker compose logs courses assignments db-init
      - name: Stop the system
        if: always()
        run: docker compose down -v

  images:
    # No image is built from a commit whose tests failed
    needs: [test, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # lets the built-in GITHUB_TOKEN push to GHCR
    strategy:
      matrix:
        service: [courses, assignments]
    steps:
      - uses: actions/checkout@v4

      # Image names must be lowercase; the repo owner is "Sanaddd"
      - name: Set lowercase owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: ${{ github.ref == 'refs/heads/main' }}
          # Container Apps cannot pull a tag that points to an attestation index
          provenance: false
          tags: ghcr.io/${{ env.OWNER }}/studyflow-${{ matrix.service }}:${{ github.sha }}
