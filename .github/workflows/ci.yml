# CI for StudyFlow (Assignment 2)
# - test:   runs each service's unit tests on every push and pull request
# - images: builds each service image on every push and pull request,
#           and publishes it to GHCR, tagged with the commit SHA, only from main
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        service: [courses, assignments]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -v

  images:
    # No image is built from a commit whose tests failed
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # lets the built-in GITHUB_TOKEN push to GHCR
    strategy:
      matrix:
        service: [courses, assignments]
    steps:
      - uses: actions/checkout@v4

      # Image names must be lowercase; the repo owner is "Sanaddd"
      - name: Set lowercase owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ env.OWNER }}/studyflow-${{ matrix.service }}:${{ github.sha }}
